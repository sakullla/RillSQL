    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 40

  mysql84:
    profiles: ["mysql-8.4"]
    image: mysql:8.4.13
    ports:
      - "127.0.0.1:3408:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
