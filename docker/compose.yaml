name: rillsql-dev

services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rillsql
    volumes:
      - pg:/var/lib/postgresql/data
      - ./init/postgres.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rillsql"]
      interval: 3s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rillsql
      MYSQL_USER: rillsql
      MYSQL_PASSWORD: rillsql
    volumes:
      - mysql:/var/lib/mysql
      - ./init/mysql.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 40

  mariadb:
    image: mariadb:11.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: rillsql
      MARIADB_USER: rillsql
      MARIADB_PASSWORD: rillsql
    volumes:
      - mariadb:/var/lib/mysql
      - ./init/mysql.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40

  # SQL Server 2022 夹具。官方镜像没有 initdb 机制，seed 由 mssql-init 容器在 healthy 后执行。
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Rillsql-Passw0rd!"
      MSSQL_PID: Developer
    volumes:
      - mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/tools18
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "Rillsql-Passw0rd!"
    volumes:
      - ./init/mssql-seed.sql:/seed/mssql-seed.sql:ro
    command: >
      bash -c "
        /opt/mssql-tools18/bin/sqlcmd -C -b -S mssql -U sa -P \"$$MSSQL_SA_PASSWORD\" -d master -Q \"IF DB_ID('rillsql') IS NULL CREATE DATABASE rillsql\"
        && /opt/mssql-tools18/bin/sqlcmd -C -b -f 65001 -S mssql -U sa -P \"$$MSSQL_SA_PASSWORD\" -d rillsql -i /seed/mssql-seed.sql
      "
    restart: "no"

  # Redis 7 夹具（R11）：--requirepass 密码认证；seed 由 redis-init 容器 healthy 后执行。
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "rillsql-redis"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a rillsql-redis ping | grep -q PONG"]
      interval: 3s
      timeout: 5s
      retries: 30

  redis-init:
    image: redis:7
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./init/redis-seed.sh:/seed/redis-seed.sh:ro
    command: ["sh", "/seed/redis-seed.sh"]
    restart: "no"

volumes:
  pg:
  mysql:
  mariadb:
  mssql:
