<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>澄库 · RillSQL UI 捕获</title><style>
body{margin:0;background:#101114;color:#f5f2ec;font:15px system-ui}header{position:sticky;top:0;padding:20px 4vw;background:#191b20;z-index:2;border-bottom:1px solid #34363d}h1{font-size:24px;margin:0 0 8px}p{color:#b3afa6}.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}label{display:grid;gap:5px;font-size:13px;color:#c9c6c0}select,input,button{font:inherit;padding:9px;border:1px solid #555;border-radius:8px;background:#25272d;color:#f5f2ec;max-width:100%;box-sizing:border-box}select{max-width:min(350px,80vw)}button{cursor:pointer}input{width:240px}.result{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 0}main{padding:24px 4vw;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:24px}figure{margin:0;padding:12px;border:1px solid #34363d;border-radius:12px;min-width:0}img{width:100%;height:340px;object-fit:contain;background:#070709}figcaption{padding:12px 0 0;overflow-wrap:anywhere}a{color:#b8d2ff}small{display:block;color:#b3afa6;margin-top:5px}#empty{padding:24px 4vw}[hidden]{display:none!important}</style></head><body><header><h1>澄库 · RillSQL UI 捕获</h1><p>捕获完成 · 6 张 · 合成 IPC 数据，仅用于界面检查。</p><form class="filters" id="filters"><label>场景<select id="scenario" aria-label="场景"><option value="">全部场景</option><option value="welcome">欢迎页与资源管理器</option><option value="connections">连接管理</option><option value="query">查询结果</option><option value="data-grid">数据表格</option><option value="command-palette">命令面板</option><option value="settings">设置</option></select></label><label>主题<select id="theme" aria-label="主题"><option value="">全部主题</option><option value="light">浅色 light</option><option value="dark">深色 dark</option></select></label><label>宽度<select id="width" aria-label="宽度"><option value="">全部宽度</option><option>1360</option></select></label><label>关键词<input id="query" type="search" placeholder="如 连接 / 表格 / 导出" aria-label="场景或关键词"></label><button type="reset">重置筛选</button></form><div class="result"><output id="count" aria-live="polite"></output><a href="capture-ui-manifest.json">捕获清单</a></div></header><p id="empty" hidden>没有匹配的图片，请调整筛选或重置。</p><main><figure data-scenario="welcome" data-theme="light" data-width="1360" data-keywords="welcome 已有连接时内容区不列连接卡片，对象树仍是连接名单 欢迎页与资源管理器"><a href="welcome-light-1360.png" target="_blank" rel="noopener"><img loading="lazy" src="welcome-light-1360.png" alt="欢迎页与资源管理器 light 1360"></a><figcaption>欢迎页与资源管理器<small>light · 1360 × 1000</small><small>已有连接时内容区不列连接卡片，对象树仍是连接名单</small></figcaption></figure><figure data-scenario="connections" data-theme="light" data-width="1360" data-keywords="connections 已连接、每次询问密码、sqlite 文件三种卡片 连接管理"><a href="connections-light-1360.png" target="_blank" rel="noopener"><img loading="lazy" src="connections-light-1360.png" alt="连接管理 light 1360"></a><figcaption>连接管理<small>light · 1360 × 1000</small><small>已连接、每次询问密码、SQLite 文件三种卡片</small></figcaption></figure><figure data-scenario="query" data-theme="light" data-width="1360" data-keywords="query 选择执行目标后的查询结果 查询结果"><a href="query-light-1360.png" target="_blank" rel="noopener"><img loading="lazy" src="query-light-1360.png" alt="查询结果 light 1360"></a><figcaption>查询结果<small>light · 1360 × 1000</small><small>选择执行目标后的查询结果</small></figcaption></figure><figure data-scenario="data-grid" data-theme="light" data-width="1360" data-keywords="data-grid orders 已读取的三行，含 null 数据表格"><a href="data-grid-light-1360.png" target="_blank" rel="noopener"><img loading="lazy" src="data-grid-light-1360.png" alt="数据表格 light 1360"></a><figcaption>数据表格<small>light · 1360 × 1000</small><small>orders 已读取的三行，含 NULL</small></figcaption></figure><figure data-scenario="command-palette" data-theme="light" data-width="1360" data-keywords="command-palette 表、连接和命令 命令面板"><a href="command-palette-light-1360.png" target="_blank" rel="noopener"><img loading="lazy" src="command-palette-light-1360.png" alt="命令面板 light 1360"></a><figcaption>命令面板<small>light · 1360 × 1000</small><small>表、连接和命令</small></figcaption></figure><figure data-scenario="settings" data-theme="light" data-width="1360" data-keywords="settings 外观、数据读取、本地数据和关于 设置"><a href="settings-light-1360.png" target="_blank" rel="noopener"><img loading="lazy" src="settings-light-1360.png" alt="设置 light 1360"></a><figcaption>设置<small>light · 1360 × 1000</small><small>外观、数据读取、本地数据和关于</small></figcaption></figure></main><script>
const ids=['scenario','theme','width','query'];const controls=ids.map(id=>document.getElementById(id));const cards=[...document.querySelectorAll('figure')];function filter(){let count=0;const query=controls[3].value.trim().toLowerCase();for(const card of cards){card.hidden=controls.slice(0,3).some((control,index)=>control.value&&card.dataset[ids[index]]!==control.value)||!card.dataset.keywords.includes(query);if(!card.hidden)count++;}document.getElementById('count').textContent='显示 '+count+' / '+cards.length+' 张';document.getElementById('empty').hidden=count!==0;}controls.forEach(control=>control.addEventListener('input',filter));document.getElementById('filters').addEventListener('submit',event=>event.preventDefault());document.getElementById('filters').addEventListener('reset',()=>setTimeout(filter,0));filter();
</script></body></html>
