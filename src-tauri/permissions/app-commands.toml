[[permission]]
identifier = "allow-app-info"
description = "允许读取关于信息。应用一旦声明自己的权限，未列出的命令会被拒绝，因此保留原有 app_info。"
commands.allow = ["app_info"]

[[permission]]
identifier = "allow-connections-list"
description = "允许列出已保存的连接。"
commands.allow = ["connections_list"]

[[permission]]
identifier = "allow-connections-save"
description = "允许保存连接配置。"
commands.allow = ["connections_save"]

[[permission]]
identifier = "allow-connections-delete"
description = "允许删除连接配置。"
commands.allow = ["connections_delete"]

[[permission]]
identifier = "allow-connections-test"
description = "允许按阶段测试连接。"
commands.allow = ["connections_test"]

[[permission]]
identifier = "allow-connections-open"
description = "允许打开已保存的连接。"
commands.allow = ["connections_open"]

[[permission]]
identifier = "allow-connections-focus-database"
description = "允许把已打开的 PostgreSQL 会话改连到同一个服务器上的另一个库，不修改已保存的配置。"
commands.allow = ["connections_focus_database"]

[[permission]]
identifier = "allow-connections-disconnect"
description = "允许断开已打开的连接。"
commands.allow = ["connections_disconnect"]

[[permission]]
identifier = "allow-connections-confirm-host-key"
description = "允许确认 SSH 主机密钥。"
commands.allow = ["connections_confirm_host_key"]

[[permission]]
identifier = "allow-connections-forget-host-key"
description = "允许忘记已保存的 SSH 主机密钥。"
commands.allow = ["connections_forget_host_key"]

[[permission]]
identifier = "allow-connections-export"
description = "允许把全部或选中的连接配置导出为 RillSQL 文件（可选口令加密），凭据永不写入。"
commands.allow = ["connections_export"]

[[permission]]
identifier = "allow-connections-import-file"
description = "允许读取 RillSQL 连接导出文件并按口令解密；格式不符或口令错误时整体拒绝。"
commands.allow = ["connections_import_file"]

[[permission]]
identifier = "allow-env-tags-list"
description = "允许读取用户维护的环境标签。"
commands.allow = ["env_tags_list"]

[[permission]]
identifier = "allow-env-tags-save"
description = "允许添加或修改环境标签。"
commands.allow = ["env_tags_save"]

[[permission]]
identifier = "allow-env-tags-delete"
description = "允许删除环境标签，并把仍使用它的连接改为无标签。"
commands.allow = ["env_tags_delete"]

[[permission]]
identifier = "allow-catalog-sessions"
description = "允许查看哪些连接会话已经打开。"
commands.allow = ["catalog_sessions"]

[[permission]]
identifier = "allow-catalog-refresh"
description = "允许从已打开的会话刷新库表。"
commands.allow = ["catalog_refresh"]

[[permission]]
identifier = "allow-catalog-page"
description = "允许从已打开的会话继续读取对象。"
commands.allow = ["catalog_page"]

[[permission]]
identifier = "allow-catalog-definition"
description = "允许从已打开的会话读取函数、存储过程或触发器的只读定义。"
commands.allow = ["catalog_definition"]

[[permission]]
identifier = "allow-diagram-read"
description = "允许从已打开的会话读取当前库或 schema 的只读关系图，不执行结构变更或数据写入。"
commands.allow = ["diagram_read"]

[[permission]]
identifier = "allow-ddl-describe"
description = "允许从已打开的会话读取表结构编辑信息。"
commands.allow = ["ddl_describe"]

[[permission]]
identifier = "allow-ddl-preview"
description = "允许为已打开的会话生成结构变更预览，不执行。"
commands.allow = ["ddl_preview"]

[[permission]]
identifier = "allow-ddl-execute"
description = "允许在已打开的会话上逐条执行已确认的结构变更。"
commands.allow = ["ddl_execute"]

[[permission]]
identifier = "allow-grid-describe"
description = "允许从已打开的会话读取表结构。"
commands.allow = ["grid_describe"]

[[permission]]
identifier = "allow-grid-page"
description = "允许从已打开的会话分页读取表数据。"
commands.allow = ["grid_page"]

[[permission]]
identifier = "allow-grid-count"
description = "允许从已打开的会话统计匹配行。"
commands.allow = ["grid_count"]

[[permission]]
identifier = "allow-grid-commit"
description = "允许在已打开的会话上逐条提交表数据变更。"
commands.allow = ["grid_commit"]

[[permission]]
identifier = "allow-grid-export"
description = "允许把已打开会话中的表数据或查询结果流式导出为 CSV。"
commands.allow = ["grid_export"]

[[permission]]
identifier = "allow-grid-export-cancel"
description = "允许取消尚未完成的 CSV 导出并删除未完成文件。"
commands.allow = ["grid_export_cancel"]

[[permission]]
identifier = "allow-database-dump"
description = "允许从已打开的会话把整库结构（可选数据）按依赖序导出为单个 SQL 文件，只读不执行。"
commands.allow = ["database_dump"]

[[permission]]
identifier = "allow-database-dump-cancel"
description = "允许取消尚未完成的全库导出并删除未完成文件。"
commands.allow = ["database_dump_cancel"]

[[permission]]
identifier = "allow-migrate-data"
description = "允许把源表的数据流式迁移到另一条已打开连接的目标表，冲突跳过、单行失败记录并继续。"
commands.allow = ["migrate_data"]

[[permission]]
identifier = "allow-migrate-cancel"
description = "允许取消尚未完成的跨库迁移；已提交的批次保留。"
commands.allow = ["migrate_cancel"]

[[permission]]
identifier = "allow-query-start"
description = "允许在已打开的会话上执行 SQL。"
commands.allow = ["query_start"]

[[permission]]
identifier = "allow-query-poll"
description = "允许读取一次 SQL 执行的状态和已完成结果。"
commands.allow = ["query_poll"]

[[permission]]
identifier = "allow-query-release"
description = "Release a completed query snapshot after the frontend receives it."
commands.allow = ["query_release"]

[[permission]]
identifier = "allow-query-cancel"
description = "允许请求取消正在执行的 SQL。"
commands.allow = ["query_cancel"]

[[permission]]
identifier = "allow-query-history"
description = "允许读取本机查询历史。"
commands.allow = ["query_history"]

[[permission]]
identifier = "allow-query-history-clear"
description = "允许清空本机查询历史。"
commands.allow = ["query_history_clear"]

[[permission]]
identifier = "allow-query-history-delete"
description = "允许删除单条本机查询历史。"
commands.allow = ["query_history_delete"]

[[permission]]
identifier = "allow-query-saved-list"
description = "允许读取本机按名称保存的查询。"
commands.allow = ["query_saved_list"]

[[permission]]
identifier = "allow-query-saved-save"
description = "允许把当前 SQL 按名称保存到本机，不执行。"
commands.allow = ["query_saved_save"]

[[permission]]
identifier = "allow-query-saved-rename"
description = "允许重命名一条本机保存的查询。"
commands.allow = ["query_saved_rename"]

[[permission]]
identifier = "allow-query-saved-delete"
description = "允许删除一条本机保存的查询。"
commands.allow = ["query_saved_delete"]

[[permission]]
identifier = "allow-read-dropped-preview"
description = "允许读取拖放到窗口的 CSV/JSON 文件的前段文本用于预览；只读且最多 2 MB，不写入任何数据。"
commands.allow = ["read_dropped_preview"]

[[permission]]
identifier = "allow-export-write-loaded"
description = "允许把已经读取的 CSV 数据保存到用户选择的本地文件。"
commands.allow = ["export_write_loaded"]

[[permission]]
identifier = "allow-compare-structure"
description = "允许读取两侧结构并生成不执行的差异脚本。"
commands.allow = ["compare_structure"]

[[permission]]
identifier = "allow-compare-data"
description = "允许按键读取选定表并生成不执行的数据差异脚本。"
commands.allow = ["compare_data"]

[[permission]]
identifier = "allow-compare-cancel"
description = "允许停止尚未完成的对比读取。"
commands.allow = ["compare_cancel"]

[[permission]]
identifier = "allow-compare-schemas"
description = "允许列出所选 PostgreSQL 库的 schema，不改连当前会话。"
commands.allow = ["compare_schemas"]

[[permission]]
identifier = "allow-redis-scan-keys"
description = "允许在已打开的 Redis 会话上按 SCAN 游标分页浏览键空间（MATCH 模式过滤），不使用 KEYS。"
commands.allow = ["redis_scan_keys"]

[[permission]]
identifier = "allow-redis-read-key"
description = "允许读取 Redis 键的类型、TTL 与按类型的值。"
commands.allow = ["redis_read_key"]

[[permission]]
identifier = "allow-redis-set-ttl"
description = "允许修改 Redis 键的 TTL（EXPIRE）或移除过期（PERSIST）。"
commands.allow = ["redis_set_ttl"]

[[permission]]
identifier = "allow-redis-delete-keys"
description = "允许删除 Redis 键；写删操作需前端二次确认（confirmed 标记）后才执行。"
commands.allow = ["redis_delete_keys"]

[[permission]]
identifier = "allow-redis-rename-key"
description = "允许重命名 Redis 键；写删操作需前端二次确认（confirmed 标记）后才执行。"
commands.allow = ["redis_rename_key"]

[[permission]]
identifier = "allow-redis-exec"
description = "允许在 Redis 会话上执行命令并结构化返回结果；KEYS 全量扫描无条件禁用，写删类命令需前端确认。"
commands.allow = ["redis_exec"]

[[permission]]
identifier = "allow-mongo-list-databases"
description = "允许在已打开的 MongoDB 会话上列出数据库与集合数（不含 admin/config/local）。"
commands.allow = ["mongo_list_databases"]

[[permission]]
identifier = "allow-mongo-list-collections"
description = "允许列出 MongoDB 库的集合清单与 estimatedDocumentCount 计数。"
commands.allow = ["mongo_list_collections"]

[[permission]]
identifier = "allow-mongo-find-documents"
description = "允许按 skip/limit 分页读取 MongoDB 集合文档；JSON 过滤在解析阶段返回行列定位错误，非法过滤不发查询。"
commands.allow = ["mongo_find_documents"]

[[permission]]
identifier = "allow-mongo-read-document"
description = "允许按 _id 读取单个 MongoDB 文档并以 relaxed 扩展 JSON 文本返回。"
commands.allow = ["mongo_read_document"]

[[permission]]
identifier = "allow-mongo-replace-document"
description = "允许整体 JSON 覆盖编辑 MongoDB 文档；JSON 校验通过才执行 replace_one。"
commands.allow = ["mongo_replace_document"]

[[permission]]
identifier = "allow-mongo-insert-document"
description = "允许新增 MongoDB 文档；JSON 校验通过才执行 insert_one，返回服务器生成的 _id。"
commands.allow = ["mongo_insert_document"]

[[permission]]
identifier = "allow-mongo-delete-document"
description = "允许按 _id 删除 MongoDB 文档；写删操作需前端二次确认（confirmed 标记）后才执行并返回删除计数。"
commands.allow = ["mongo_delete_document"]
