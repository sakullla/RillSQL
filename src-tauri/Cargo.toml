[package]
name = "rillsql"
version = "0.2.17"
description = "RillSQL"
authors = ["RillSQL"]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.90"

[lib]
name = "rillsql_lib"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "runtime-tokio", "sqlite", "uuid"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["native-certs", "ring"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["chrono", "default-rustls-ring"] }
tiberius = { version = "0.12.3", default-features = false, features = ["chrono", "rustls", "tds73"] }
redis = { version = "0.32.7", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure"] }
# MongoDB（R12）：官方驱动，tokio + rustls TLS；SCRAM-SHA-1/256 内置协商。
# compat-3-0-0 = bson 2.x 与既有依赖形态一致；dns-resolver 供 mongodb+srv:// 连接串。
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
tokio-util = { version = "0.7.16", default-features = false, features = ["compat"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
keyring = "4.2.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
csv = "1.4.0"
calamine = "=0.38.0"
rust_xlsxwriter = "=0.102.0"
tracing = "0.1.44"
async-trait = "0.1.92"
futures = "0.3.34"
directories = "6.0.0"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
# gpui-kit 0.9.0 与 gpui-pre / gpui-pre-platform / gpui-pre-macros 0.3.11 一起锁定。
# 禁止只升其中一个。x11+wayland 给 Linux，font-kit/runtime_shaders 给 macOS；
# Windows 由 gpui-pre-platform 选择 Win32/DirectWrite。不要启用 gpui-fast。
gpui-kit = { version = "=0.9.0", features = ["tree-sitter-sql"] }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_macros = { package = "gpui-pre-macros", version = "=0.3.11" }
lsp-types = { version = "=0.97.0", features = ["proposed"] }
# 客户端验签使用既有发布的 minisign 文本；版本绑定在本 crate 内完成。
minisign-verify = "0.3"
base64 = "0.22"
# 安装阶段复用 cargo-packager-updater，但清单仍是现有 latest.json，不要求 format 字段。
cargo-packager-updater = "=0.2.3"
cargo-packager = { version = "=0.11.8", optional = true }
minisign = { version = "0.7", optional = true }
toml = { version = "0.9", optional = true }

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["test-support", "tree-sitter-sql"] }
minisign = "0.7"

[features]
# 只给 rillsql-package 使用。不要放进 default，避免产品二进制去编打包器。
packager = ["dep:cargo-packager", "dep:minisign", "dep:toml"]

[package.metadata.packager]
product-name = "RillSQL"
identifier = "app.rillsql.desktop"
description = "RillSQL"
homepage = "https://github.com/sakullla/RillSQL"
publisher = "RillSQL"
license-file = "../LICENSE"
icons = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]
# 非当前主机的格式由 cargo-packager 忽略。发布仍要四个安装包都在。
formats = ["nsis", "app", "dmg", "deb", "appimage"]

[[package.metadata.packager.binaries]]
path = "RillSQL"
main = true

[package.metadata.packager.nsis]
installer-icon = "icons/icon.ico"
languages = ["SimpChinese", "English"]
installer-mode = "currentUser"
