[package]
name = "rillsql"
version = "0.2.3"
description = "RillSQL"
authors = ["RillSQL"]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.90"

[lib]
name = "rillsql_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "runtime-tokio", "sqlite", "uuid"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["native-certs", "ring"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["chrono", "default-rustls-ring"] }
tiberius = { version = "0.12.3", default-features = false, features = ["chrono", "rustls", "tds73"] }
redis = { version = "0.32.7", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure"] }
# MongoDB（R12）：官方驱动，tokio + rustls TLS；SCRAM-SHA-1/256 内置协商。
# compat-3-0-0 = bson 2.x 与既有依赖形态一致；dns-resolver 供 mongodb+srv:// 连接串。
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
tokio-util = { version = "0.7.16", default-features = false, features = ["compat"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
keyring = "4.2.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
csv = "1.4.0"
tracing = "0.1.44"
async-trait = "0.1.92"
futures = "0.3.34"
directories = "6.0.0"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
