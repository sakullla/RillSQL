[package]
name = "rillsql"
version = "0.1.0"
description = "澄库 · RillSQL"
authors = ["RillSQL"]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.90"

[lib]
name = "rillsql_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "runtime-tokio", "sqlite", "uuid"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["native-certs", "ring"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["chrono", "default-rustls-ring"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
keyring = "4.2.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
csv = "1.4.0"
tracing = "0.1.44"
async-trait = "0.1.92"
futures = "0.3.34"
directories = "6.0.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
