name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Require main CI for the tagged commit
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve tag to commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for main CI
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const { waitForMainCi } = require('./.github/scripts/wait-for-main-ci.cjs');
            await waitForMainCi({ github, repo: context.repo, sha: process.env.RELEASE_SHA, log: core.info });

  prepare:
    name: Prepare draft release
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate tag and generate changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          node .github/scripts/release.mjs check "$RELEASE_TAG"
          node .github/scripts/release.mjs notes "$RELEASE_TAG" > release-notes.md
      - name: Create or resume draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp \
            | jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first')
          endpoint="repos/$GITHUB_REPOSITORY/releases"
          method=POST
          if [[ "$release" != null ]]; then
            if [[ $(jq -r '.draft' <<< "$release") != true ]]; then
              echo "::error::Release is already published; use a new version tag."
              exit 1
            fi
            if [[ $(jq -r '.target_commitish' <<< "$release") != "$RELEASE_SHA" ]]; then
              echo "::error::Draft belongs to another commit; use a new version tag."
              exit 1
            fi
            endpoint="$endpoint/$(jq -r '.id' <<< "$release")"
            method=PATCH
          fi
          release_id=$(gh api --method "$method" "$endpoint" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$RELEASE_SHA" \
            -f name="RillSQL $RELEASE_TAG" -F body=@release-notes.md \
            -F draft=true -F prerelease="$PRERELEASE" --jq '.id')
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: [gate, prepare]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            platform: macOS ARM64
            target: aarch64-apple-darwin
            # DMG alone does not retain the app or create its signed updater archive.
            bundles: app,dmg
          - os: ubuntu-22.04
            platform: Linux x64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash .github/scripts/install-linux-deps.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-v1-${{ matrix.target }}
          cache-bin: false
          save-if: false
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for signed app updates."
            exit 1
          fi
      - name: Build and upload to draft release
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          retryAttempts: 2
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Build and sign macOS bundles with the stable certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # CI=true makes Tauri skip the Finder layout step of the DMG.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?Stable macOS certificate is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Certificate password is required}"
          : "${APPLE_SIGNING_IDENTITY:?Signing identity is required}"
          env -u APPLE_CERTIFICATE -u APPLE_CERTIFICATE_PASSWORD -u APPLE_SIGNING_IDENTITY \
            npm run tauri -- build --target "$TARGET" --bundles app,dmg --no-sign -- --locked
          version=$(node -p "require('./package.json').version")
          bundle="src-tauri/target/$TARGET/release/bundle"
          bash .github/scripts/sign-macos-bundles.sh "$bundle" "$version"
          bash .github/scripts/verify-macos-bundles.sh "$bundle" "$version"
          updater="$bundle/macos/RillSQL_${version}_aarch64.app.tar.gz"
          mv "$bundle/macos/RillSQL.app.tar.gz" "$updater"
          npm run tauri -- signer sign "$updater" --app-version "$version"
          test -s "$updater.sig"
          gh release upload "$RELEASE_TAG" \
            "$bundle/dmg/RillSQL_${version}_aarch64.dmg" "$updater" "$updater.sig" --clobber

  publish:
    name: Verify assets and publish
    needs: [gate, prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require all platform installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          node .github/scripts/release.mjs verify release.json "$RELEASE_TAG" "$RELEASE_SHA"
      - name: Generate the complete signed updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/updater-manifest"
          mkdir -p "$work"
          gh release download "$RELEASE_TAG" --pattern '*.sig' --dir "$work"
          node .github/scripts/updater.mjs release.json "$RELEASE_TAG" "$RELEASE_SHA" "$work" "$GITHUB_REPOSITORY" > "$work/latest.json"
          gh release upload "$RELEASE_TAG" "$work/latest.json" --clobber
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
          if [[ "$current_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Tag moved during the release; refusing to publish."
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false --jq '.html_url'
