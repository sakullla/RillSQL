name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check release metadata
        run: node .github/scripts/release.mjs check
      - name: Test release guards
        run: node --test .github/scripts/release.test.mjs
      - name: Scan for undictionaried UI text
        run: node scripts/i18n-scan.mjs
      - name: Unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build

  ui:
    name: Browser verification
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Vite
        run: |
          npm run dev > vite.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:1420 > /dev/null && exit 0
            sleep 1
          done
          cat vite.log
          exit 1
      # Synthetic IPC: frontend rendering only, not native or database evidence.
      - name: Verify workbench
        run: npm run verify:workbench
      - name: Capture UI
        env:
          RILLSQL_CAPTURE_OUT: ${{ runner.temp }}/ui-capture
        run: npm run capture:ui
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-capture
          path: ${{ runner.temp }}/ui-capture
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            os: windows-latest
          - platform: macOS ARM64
            os: macos-latest
          - platform: Linux x64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash .github/scripts/install-linux-deps.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      # tauri::generate_context! embeds ../dist, so the frontend must exist first.
      - run: npm run build
      - name: Test backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets
