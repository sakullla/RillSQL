name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check release metadata
        run: node .github/scripts/release.mjs check
      - name: Test release guards
        run: node --test .github/scripts/release.test.mjs
      - name: Scan for undictionaried UI text
        run: node scripts/i18n-scan.mjs
      - name: Unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Share the verified frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  ui:
    name: Browser verification
    needs: frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Preview the production build
        run: |
          npm run preview -- --host 127.0.0.1 --port 1420 > vite.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:1420 > /dev/null && exit 0
            sleep 1
          done
          cat vite.log
          exit 1
      # Synthetic IPC: frontend rendering only, not native or database evidence.
      - name: Verify workbench
        run: npm run verify:workbench
      - name: Capture UI
        env:
          RILLSQL_CAPTURE_OUT: ${{ runner.temp }}/ui-capture
        run: npm run capture:ui
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-capture
          path: ${{ runner.temp }}/ui-capture
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust (${{ matrix.platform }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            os: windows-latest
          - platform: macOS ARM64
            os: macos-latest
          - platform: Linux x64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash .github/scripts/install-linux-deps.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Native XLSX export tests use the JS codec to independently read the workbook.
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ github.event_name != 'pull_request' }}
      # tauri::generate_context! embeds ../dist, so the frontend must exist first.
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist
      - name: Test backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets

  release-cache:
    name: Prepare release cache (${{ matrix.target }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        id: release-cache
        with:
          # Must match release.yml; tags restore main's release dependencies.
          shared-key: release-v1-${{ matrix.target }}
          workspaces: src-tauri -> target
          cache-bin: false
      - name: Install Linux dependencies
        if: steps.release-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        timeout-minutes: 10
        run: bash .github/scripts/install-linux-deps.sh
      - uses: actions/download-artifact@v8
        if: steps.release-cache.outputs.cache-hit != 'true'
        with:
          name: frontend-dist
          path: dist
      - name: Compile release dependencies without packaging
        if: steps.release-cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --features tauri/custom-protocol
